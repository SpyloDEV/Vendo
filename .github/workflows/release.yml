name: Build & Release ZIP

on:
  push:
    tags:
      - 'v*.*.*'        # z. B. v0.2.1, v1.0.0
      - 'v*.*.*-*'      # z. B. v0.2.1-beta1, v0.3.0-alpha2

permissions:
  contents: write      # notwendig für Releases & Assets

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repository auschecken
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volle Historie (gut für spätere Changelogs)

      # 2️⃣ Version & ZIP-Name aus Tag bestimmen
      - name: Determine version and filename
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          ZIP_NAME="Vendo-${VERSION#v}.zip"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      # 3️⃣ Addon-Ordner vorbereiten
      - name: Prepare addon folder
        run: |
          mkdir -p dist/Vendo
          rsync -av \
            --exclude-from=.gitignore \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            ./ dist/Vendo/

      # 4️⃣ ZIP erstellen (korrekte Struktur!)
      - name: Create ZIP archive
        working-directory: dist
        run: |
          zip -r "${{ steps.vars.outputs.zip_name }}" Vendo

      # 5️⃣ GitHub Release erstellen (MIT MANUELLEM BODY)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vendo ${{ steps.vars.outputs.version }}
          body: |
            **Vendo ${{ steps.vars.outputs.version }}** ist jetzt verfügbar!

            ### 🛠 Bugfixes & Improvements
            - Fixed addon detection issues after updates
            - Improved CurseForge client compatibility
            - Enhanced update stability

            ### 📦 Installation
            1. Lade das ZIP herunter
            2. Entpacke es in deinen WoW AddOns-Ordner (`Interface\AddOns`)
            3. Starte oder reloade WoW und aktiviere Vendo

            Thanks to everyone who reported issues and helped improve the addon!
            Viel Spaß beim Gold sparen! 💰
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: false
          files: dist/${{ steps.vars.outputs.zip_name }}
