name: Build & Release ZIP

on:
  push:
    tags:
      - 'v*.*.*'           # z. B. v0.2.1, v1.0.0
      - 'v*.*.*-*'         # z. B. v0.2.1-beta1, v0.3.0-alpha2

permissions:
  contents: write        # Für Releases und Tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Vollständige History → für gute Release Notes

      - name: Determine version and filename
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          ZIP_NAME="Vendo-${VERSION#v}.zip"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Prepare addon folder
        run: |
          mkdir -p dist/Vendo
          
          # Kopiere nur die relevanten Dateien (gitignore-respektierend)
          rsync -av --exclude-from=.gitignore \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            ./ dist/Vendo/

      - name: Create ZIP archive
        working-directory: dist
        run: |
          zip -r "${{ steps.vars.outputs.zip_name }}" Vendo

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vendo ${{ steps.vars.outputs.version }}
          body: |
            **Vendo ${{ steps.vars.outputs.version }}** ist jetzt verfügbar!

            ### Wichtige Änderungen
            - Automatisch generierte Release-Notes aus Commits (siehe unten)

            ### Installation
            1. Lade das ZIP herunter
            2. Entpacke in deinen WoW AddOns-Ordner (`Interface\AddOns\`)
            3. Starte/relade WoW und aktiviere Vendo

            Viel Spaß beim Gold sparen! 💰
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: dist/${{ steps.vars.outputs.zip_name }}
